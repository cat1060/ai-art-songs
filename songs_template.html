<title>Faculty Art Songs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#f7f8fa;--paper:#fff;--fg:#1d2230;--muted:#5d6577;--line:#d8dce5;--accent:#2f5d8a;
--display:"Cormorant Garamond",Georgia,serif;--body:"Source Sans 3",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171e;--paper:#1c2029;--fg:#e4e7ee;--muted:#9aa2b3;--line:#323847;--accent:#8db6e0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171e;--paper:#1c2029;--fg:#e4e7ee;--muted:#9aa2b3;--line:#323847;--accent:#8db6e0;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);margin:0}
main{max-width:1000px;margin:auto;padding-inline:16px;padding-block:32px 64px;display:grid;gap:24px}
h1{font:600 2.4rem/1.1 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0}
.lbl{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* Score always on white paper so notation stays legible in dark mode */
#score{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;overflow-x:auto}
.player{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.play{font:600 1rem var(--body);background:var(--accent);color:var(--bg);border:0;border-radius:6px;padding:8px 18px;cursor:pointer;min-width:96px}
.play:focus-visible,.player input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.player label{display:flex;align-items:center;gap:6px;color:var(--muted);font-variant-numeric:tabular-nums}
.voices{display:flex;flex-wrap:wrap;gap:4px 12px}
.pick{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 14px}
select{font:1rem var(--body);color:var(--fg);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 10px;max-width:100%}
.status{color:var(--muted);font-size:.9rem}
.note{color:var(--muted);max-width:65ch;font-size:.9rem}
</style>
<main>
<header>
<div class="pick"><label class="lbl" for="pick">Song</label><select id="pick"></select><span class="status" id="status" role="status"></span></div>
<h1 id="t"></h1><p class="sub" id="genre"></p></header>
<div class="player"><button class="play" id="play" type="button">▶ Play</button>
<label for="inst">Melody <select id="inst"><option value="clarinet">Clarinet</option><option value="oboe">Oboe</option><option value="flute">Flute</option><option value="recorder">Recorder</option><option value="piano">Piano</option><option value="organ">Organ</option></select></label>
<label for="acc">Band <select id="acc"><option value="piano">Piano</option><option value="organ">Organ</option></select></label>
<label for="bpm">Tempo <input id="bpm" type="range" min="40" max="220" value="90"> <span id="bpmv">90</span> bpm</label>
<div class="voices" id="voices"></div></div>
<div id="score">Loading notation…</div>
<p class="note">The sung line plays on the melody instrument; every other part plays on the band instrument. Samples come from the FluidR3 General MIDI soundfont, with the recorder from the FatBoy set.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js"></script>
<script>
const INDEX=__INDEX__;
const cache=new Map();
let A=null,osmd=null,playing=false,pOn=[];
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
pick.innerHTML=INDEX.map((e,i)=>`<option value="${i}">${esc(e.title)}</option>`).join('');

async function loadSong(i){
 const e=INDEX[i];stop();
 if(!cache.has(e.file)){status.textContent='Loading…';
  try{const r=await fetch(e.file);if(!r.ok)throw new Error(r.status);cache.set(e.file,await r.json())}
  catch(err){status.textContent=`Could not load ${e.title}. Check your connection and pick it again.`;return}}
 status.textContent='';A=cache.get(e.file);try{history.replaceState(null,'','#'+e.id)}catch{}
 t.textContent=A.title;genre.textContent=A.genre;
 bpm.value=A.bpm;bpmv.textContent=A.bpm;
 pOn=A.parts.map(()=>true);
 voices.innerHTML=A.parts.map((p,i)=>`<label for="v${i}"><input type="checkbox" id="v${i}" checked> ${esc(p.name)}</label>`).join('');
 A.parts.forEach((p,i)=>document.getElementById('v'+i).onchange=ev=>pOn[i]=ev.target.checked);
 if(!osmd)return;score.querySelector('.err')?.remove();
 osmd.load(A.musicxml).then(()=>{osmd.zoom=window.innerWidth<600?.6:.8;osmd.render()}).catch(err=>score.insertAdjacentHTML('afterbegin',`<p class="err">Notation failed to render: ${esc(err.message)}</p>`))}

bpm.oninput=()=>{bpmv.textContent=bpm.value;if(typeof Tone!=='undefined'&&Tone.Transport.state==='started')Tone.Transport.bpm.value=+bpm.value};

// Sampled instruments: JSON maps of note -> base64 mp3, decoded locally
const samplers={};let rev=null;
async function getSampler(name,slot){const k=name+'/'+slot;
 if(samplers[k])return samplers[k];
 const map=await (await fetch(`sounds/${name}.json`)).json();
 const urls={};
 await Promise.all(Object.entries(map).map(async([n,uri])=>{
  const bin=Uint8Array.from(atob(uri.split(',')[1]),c=>c.charCodeAt(0));
  urls[n]=await Tone.getContext().rawContext.decodeAudioData(bin.buffer)}));
 rev??=new Tone.Reverb({decay:2.8,wet:.22}).toDestination();
 const s=new Tone.Sampler({urls,release:name==='piano'?1:.35}).connect(rev);
 s.volume.value=slot==='lead'?-6:-12;   // melody sits above the band
 return samplers[k]=s}
// Melody and band get separate samplers, so they balance even when both use the same instrument
const getPair=()=>Promise.all([getSampler(inst.value,'lead'),getSampler(acc.value,'band')]);

// Move the OSMD cursor forward to the first position at or after quarter-note offset q
function seek(q){if(!osmd||!osmd.cursor)return;const c=osmd.cursor;
 if(c.Iterator.currentTimeStamp.RealValue*4>q+1e-6)c.reset();
 while(!c.Iterator.EndReached&&c.Iterator.currentTimeStamp.RealValue*4<q-1e-6)c.next();
 followLine();}
// Scroll only when the cursor moves onto a new line of music
let lineTop=null;
function followLine(force){const el=osmd?.cursor?.cursorElement;if(!el)return;
 const top=Math.round(el.offsetTop);if(!force&&top===lineTop)return;lineTop=top;
 const r=el.getBoundingClientRect(),bar=document.querySelector('.player').getBoundingClientRect().bottom;
 window.scrollBy({top:r.top-bar-16,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
let used=[];
function stop(){if(osmd&&osmd.cursor){osmd.cursor.reset();osmd.cursor.hide()}
 if(typeof Tone!=='undefined'){Tone.Transport.stop();Tone.Transport.cancel();used.forEach(s=>s.releaseAll())}
 playing=false;play.textContent='▶ Play'}
play.onclick=async()=>{
 if(typeof Tone==='undefined'){play.textContent='Audio unavailable';return}
 if(playing)return stop();
 if(!A)return;
 await Tone.start();
 play.disabled=true;status.textContent='Loading instruments…';let lead,band;
 try{[lead,band]=await getPair();status.textContent=''}catch(err){status.textContent='Could not load instruments. Try again.';play.disabled=false;return}
 play.disabled=false;used=[lead,band];
 Tone.Transport.bpm.value=+bpm.value;Tone.Transport.cancel();
 A.parts.forEach((p,i)=>{const s=p.lead?lead:band;p.notes.forEach(([midi,on,dur])=>
  Tone.Transport.schedule(t=>{if(pOn[i])s.triggerAttackRelease(Tone.Frequency(midi,'midi').toNote(),dur*60/Tone.Transport.bpm.value*0.95,t)},`0:${on}`))});
 // Notes play in performed order (repeats expanded); the cursor follows written positions
 const writtenAt=new Map(A.parts.flatMap(p=>p.notes.map(n=>[n[1],n[3]])));
 writtenAt.forEach((w,on)=>Tone.Transport.schedule(t=>Tone.Draw.schedule(()=>seek(w),t),`0:${on}`));
 if(osmd&&osmd.cursor){osmd.cursor.reset();osmd.cursor.show();lineTop=null;followLine(true)}
 const end=Math.max(...A.parts.flatMap(p=>p.notes.map(n=>n[1]+n[2])));
 Tone.Transport.schedule(t=>Tone.Draw.schedule(stop,t+1.5),`0:${end}`);
 Tone.Transport.position=0;Tone.Transport.start('+0.1');playing=true;play.textContent='■ Stop'};

try{osmd=new opensheetmusicdisplay.OpenSheetMusicDisplay('score',{autoResize:true,followCursor:false,cursorsOptions:[{type:0,color:'#2f5d8a',alpha:.45,follow:false}],drawTitle:false,drawComposer:false,drawCredits:false,drawPartNames:true,drawLyrics:true});score.textContent=''}
catch(e){score.textContent='Notation library failed to load.'}
pick.onchange=()=>loadSong(+pick.value);
const fromHash=INDEX.findIndex(e=>'#'+e.id===location.hash);
pick.value=String(Math.max(0,fromHash));
loadSong(+pick.value);
</script>
